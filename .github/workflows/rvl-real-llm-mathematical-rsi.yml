name: rvl-real-llm-mathematical-rsi

on:
  workflow_dispatch:
    inputs:
      learned_verifier_run_id:
        description: 'Completed qwen learned-verifier Actions run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rvl-real-llm-mathematical-rsi-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEARNED_VERIFIER_SOURCE_SHA: '8602c0a94d246a25efea7079c2e65cd514995d48'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert immutable downstream source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import re, os
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['GITHUB_SHA'])
          PY
      - name: Install replay dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Validate run id
        env:
          UPSTREAM_RUN_ID: ${{ inputs.learned_verifier_run_id }}
        run: |
          python - <<'PY'
          import os
          run_id=os.environ['UPSTREAM_RUN_ID'].strip()
          if not run_id.isdigit() or int(run_id) <= 0:
              raise SystemExit('positive learned_verifier_run_id required')
          PY
      - name: Download exact learned-verifier artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rvl-qwen-learned-verifier-v1-${{ inputs.learned_verifier_run_id }}
          path: upstream/qwen_learned_verifier
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.learned_verifier_run_id }}
      - name: Revalidate learned-verifier evidence chain
        run: |
          mkdir -p promotion/recomputed
          python scripts/validate_qwen_learned_verifier_evidence.py \
            upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1 \
            --protocol upstream/qwen_learned_verifier/configs/qwen_learned_verifier_bridge_v1.json \
            --expected-research-sha "$LEARNED_VERIFIER_SOURCE_SHA" \
            --output promotion/recomputed/qwen_learned_verifier_bridge_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          recorded=json.loads(Path('upstream/qwen_learned_verifier/validation/qwen_learned_verifier_bridge_v1.json').read_text())
          recomputed=json.loads(Path('promotion/recomputed/qwen_learned_verifier_bridge_v1.json').read_text())
          assert recorded == recomputed, 'upstream semantic validation mismatch'
          assert recomputed['valid'] is True
          assert recomputed['execution_status'] == 'completed'
          assert recomputed['scientific_result'] in {'direction_passed','direction_failed','underpowered'}
          PY
          python scripts/research_evidence_promotion.py validate \
            upstream/qwen_learned_verifier/promotion/qwen_alignment_to_learned_verifier.json \
            --stage qwen_alignment_to_learned_verifier \
            --downstream-run-id "${{ inputs.learned_verifier_run_id }}" \
            --downstream-source-sha "$LEARNED_VERIFIER_SOURCE_SHA" \
            --downstream-protocol upstream/qwen_learned_verifier/configs/qwen_learned_verifier_bridge_v1.json
      - name: Create downstream evidence receipt
        run: |
          python scripts/research_evidence_promotion.py create \
            --stage learned_verifier_to_mathematical_rsi \
            --upstream-run-id "${{ inputs.learned_verifier_run_id }}" \
            --upstream-artifact-name "rvl-qwen-learned-verifier-v1-${{ inputs.learned_verifier_run_id }}" \
            --upstream-manifest upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1/manifest.json \
            --upstream-validation upstream/qwen_learned_verifier/validation/qwen_learned_verifier_bridge_v1.json \
            --downstream-run-id "${{ github.run_id }}" \
            --downstream-source-sha "$GITHUB_SHA" \
            --downstream-protocol configs/real_llm_mathematical_rsi_v1.json \
            --output promotion/learned_verifier_to_mathematical_rsi.json
      - name: Validate CPU contracts
        run: |
          python -m py_compile \
            scripts/run_real_llm_mathematical_rsi.py \
            scripts/validate_real_llm_mathematical_rsi_evidence.py
          python -m unittest tests.test_real_llm_mathematical_rsi -v
      - name: Execute locked real-model replay
        run: |
          rm -rf results/real_llm_mathematical_rsi_v1
          python scripts/run_real_llm_mathematical_rsi.py \
            --protocol configs/real_llm_mathematical_rsi_v1.json \
            --input-root upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1 \
            --output results/real_llm_mathematical_rsi_v1
      - name: Independently validate replay
        run: |
          mkdir -p validation
          python scripts/validate_real_llm_mathematical_rsi_evidence.py \
            results/real_llm_mathematical_rsi_v1 \
            --protocol configs/real_llm_mathematical_rsi_v1.json \
            --input-root upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1 \
            --output validation/real_llm_mathematical_rsi_v1.json
          cat validation/real_llm_mathematical_rsi_v1.json
      - name: Record workflow provenance
        if: always()
        env:
          UPSTREAM_RUN_ID: ${{ inputs.learned_verifier_run_id }}
        run: |
          mkdir -p provenance
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('configs/real_llm_mathematical_rsi_v1.json')
          payload={
              'schema_version':1,
              'repository':os.environ.get('GITHUB_REPOSITORY'),
              'workflow':os.environ.get('GITHUB_WORKFLOW'),
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_attempt':int(os.environ.get('GITHUB_RUN_ATTEMPT','1')),
              'research_source_sha':os.environ['GITHUB_SHA'],
              'protocol_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'upstream_run_id':int(os.environ['UPSTREAM_RUN_ID']),
              'runner_os':os.environ.get('RUNNER_OS'),
              'runner_arch':os.environ.get('RUNNER_ARCH'),
          }
          Path('provenance/workflow.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload immutable replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rvl-real-llm-mathematical-rsi-v1-${{ github.run_id }}
          path: |
            configs/real_llm_mathematical_rsi_v1.json
            results/real_llm_mathematical_rsi_v1/
            validation/real_llm_mathematical_rsi_v1.json
            promotion/learned_verifier_to_mathematical_rsi.json
            promotion/recomputed/qwen_learned_verifier_bridge_v1.json
            provenance/workflow.json
          if-no-files-found: error
          retention-days: 90
