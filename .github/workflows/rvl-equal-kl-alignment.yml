name: rvl-equal-kl-alignment

on:
  push:
    branches: [research/rvl-transfer-evidence-v3]
    paths:
      - configs/equal_kl_alignment_stress_v1.json
      - src/equal_kl_alignment_stress.py
      - tests/test_equal_kl_alignment_stress.py
      - .github/workflows/rvl-equal-kl-alignment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rvl-equal-kl-alignment-v1
  cancel-in-progress: false

jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rvl-transfer-evidence-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install -r requirements.txt
      - name: Validate mechanism contracts
        run: python -m unittest tests.test_equal_kl_alignment_stress -v
      - name: Execute locked equal-KL alignment stress
        run: |
          rm -rf results/equal_kl_alignment_stress_v1
          python -m src.equal_kl_alignment_stress             --protocol configs/equal_kl_alignment_stress_v1.json             --output results/equal_kl_alignment_stress_v1
      - name: Enforce prospective primary decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('results/equal_kl_alignment_stress_v1/manifest.json').read_text())
          if not manifest['primary_prediction_passed']:
              raise SystemExit('locked primary geometry prediction failed')
          print(json.dumps({
              'primary_phase_accuracy': manifest['primary_phase_accuracy'],
              'attainable_rows': manifest['attainable_rows'],
              'unattainable_rows': manifest['unattainable_rows'],
          }, indent=2))
          PY
      - name: Preserve complete raw experiment
        uses: actions/upload-artifact@v4
        with:
          name: rvl-equal-kl-alignment-v1-${{ github.run_id }}
          path: |
            configs/equal_kl_alignment_stress_v1.json
            results/equal_kl_alignment_stress_v1/
          retention-days: 90
      - name: Commit deterministic evidence to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/equal_kl_alignment_stress_v1
          git diff --cached --quiet && exit 0
          git commit -m "Archive locked equal-KL verifier alignment evidence [skip ci]"
          git push origin HEAD:research/rvl-transfer-evidence-v3
