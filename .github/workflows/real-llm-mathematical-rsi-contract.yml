name: real-llm-mathematical-rsi-contract

on:
  pull_request:
    paths:
      - 'scripts/run_real_llm_mathematical_rsi.py'
      - 'scripts/validate_real_llm_mathematical_rsi_evidence.py'
      - 'configs/real_llm_mathematical_rsi_v1.json'
      - 'tests/test_real_llm_mathematical_rsi.py'
      - 'docs/real_llm_mathematical_rsi.md'
      - '.github/workflows/real-llm-mathematical-rsi-contract.yml'
      - '.github/workflows/rvl-real-llm-mathematical-rsi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Compile replay and validator
        run: |
          python -m py_compile \
            scripts/run_real_llm_mathematical_rsi.py \
            scripts/validate_real_llm_mathematical_rsi_evidence.py
      - name: Run real-LLM mathematical RSI fixture
        run: python -m unittest tests.test_real_llm_mathematical_rsi -v
