name: upstream-verl-workload-routing-cpu

on:
  push:
    branches:
      - 'upstream/verl-workload-aware-v1'
    paths:
      - 'upstream/verl/**'
      - '.github/workflows/upstream-verl-workload-routing-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install light dependencies
        run: python -m pip install cachetools
      - name: Compile prototype and staged upstream port
        run: |
          python -m py_compile             upstream/verl/workload_aware_router_prototype.py             upstream/verl/benchmark_workload_aware_router.py             upstream/verl/benchmark_real_endpoints.py             upstream/verl/generate_routing_traces.py             upstream/verl/port/verl/workers/rollout/router.py             upstream/verl/port/verl/workers/rollout/llm_server.py             upstream/verl/port/tests/workers/rollout/test_router_on_cpu.py
      - name: Run policy accounting tests
        run: python -m unittest -v upstream.verl.test_workload_aware_router_prototype
      - name: Run deterministic scheduling sanity benchmark
        run: |
          python -m upstream.verl.benchmark_workload_aware_router             --requests 512 --servers 8 --seed 17             --output /tmp/workload-aware.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/workload-aware.json'))
          assert r['workload_aware']['work_imbalance_ratio'] < r['least_inflight']['work_imbalance_ratio']
          assert r['workload_aware']['makespan_s'] < r['least_inflight']['makespan_s']
          assert 'Synthetic' in r['claim_boundary']
          print(json.dumps(r['relative'], indent=2))
          PY
      - name: Verify pinned upstream base
        run: |
          test "$(cat upstream/verl/port/BASE_SHA.txt | tr -d '\n')" =             "8718ca30a3f002f93b7c4fd99b9b2506718681bc"
