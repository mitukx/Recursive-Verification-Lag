name: recovered-qwen-mathematical-rsi

on:
  pull_request:
    paths:
      - 'scripts/run_recovered_qwen_mathematical_rsi.py'
      - 'scripts/validate_recovered_qwen_mathematical_rsi.py'
      - 'configs/recovered_qwen_mathematical_rsi_v1.json'
      - 'tests/test_recovered_qwen_mathematical_rsi.py'
      - 'docs/recovered_qwen_mathematical_rsi.md'
      - '.github/workflows/recovered-qwen-mathematical-rsi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Compile
        run: |
          python -m py_compile \
            scripts/run_recovered_qwen_mathematical_rsi.py \
            scripts/validate_recovered_qwen_mathematical_rsi.py
      - name: Contract tests on committed real Qwen bank
        run: python -m unittest tests.test_recovered_qwen_mathematical_rsi -v
      - name: Execute locked exploratory replay
        run: |
          rm -rf artifacts/recovered-qwen-math-rsi
          python scripts/run_recovered_qwen_mathematical_rsi.py \
            --protocol configs/recovered_qwen_mathematical_rsi_v1.json \
            --bank data/recovered_qwen05b_bank.jsonl \
            --output artifacts/recovered-qwen-math-rsi
      - name: Independent semantic validation
        run: |
          mkdir -p artifacts/validation
          python scripts/validate_recovered_qwen_mathematical_rsi.py \
            artifacts/recovered-qwen-math-rsi \
            --protocol configs/recovered_qwen_mathematical_rsi_v1.json \
            --bank data/recovered_qwen05b_bank.jsonl \
            --output artifacts/validation/recovered-qwen-math-rsi.json
          cat artifacts/validation/recovered-qwen-math-rsi.json
          cat artifacts/recovered-qwen-math-rsi/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovered-qwen-mathematical-rsi-${{ github.run_id }}
          path: |
            configs/recovered_qwen_mathematical_rsi_v1.json
            artifacts/recovered-qwen-math-rsi/
            artifacts/validation/recovered-qwen-math-rsi.json
          if-no-files-found: error
          retention-days: 90
