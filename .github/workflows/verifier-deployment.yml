name: verifier-deployment-contract

on:
  pull_request:
    paths:
      - 'src/rvl_systems/verifier_rpc.py'
      - 'src/rvl_systems/verifier_deployment.py'
      - 'tests/test_verifier_deployment.py'
      - 'docs/verifier_deployment.md'
      - '.github/workflows/verifier-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Two-phase verifier deployment contracts
        run: python -m unittest tests.test_verifier_rpc tests.test_verifier_deployment -v
      - name: Syntax check
        run: python -m py_compile src/rvl_systems/verifier_rpc.py src/rvl_systems/verifier_deployment.py
