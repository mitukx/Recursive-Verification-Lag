name: rvl-real-llm-active-audit

on:
  push:
    branches:
      - 'evidence/real-llm-active-audit-v1'
    paths:
      - 'real-llm-active-audit-trigger.json'
  workflow_dispatch:
    inputs:
      learned_verifier_run_id:
        description: 'Completed Issue #43 Actions run ID whose immutable artifact will gate this replay'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rvl-real-llm-active-audit-v1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEARNED_VERIFIER_SOURCE_SHA: '8602c0a94d246a25efea7079c2e65cd514995d48'
      ACTIVE_AUDIT_SOURCE_SHA: '857264b432c8d10fdc2a5bb838f9afc5e8c7b3c6'
    steps:
      - name: Checkout trigger revision
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trigger
      - name: Resolve upstream Issue #43 run ID
        id: upstream
        env:
          DISPATCH_RUN_ID: ${{ inputs.learned_verifier_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              data=json.loads(Path('trigger/real-llm-active-audit-trigger.json').read_text())
              run_id=str(data.get('learned_verifier_run_id','')).strip()
          else:
              run_id=os.environ.get('DISPATCH_RUN_ID','').strip()
          if not run_id.isdigit() or int(run_id) <= 0:
              raise SystemExit('positive learned_verifier_run_id required')
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write(f'run_id={run_id}\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 857264b432c8d10fdc2a5bb838f9afc5e8c7b3c6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install active-audit dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Download exact Issue #43 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rvl-qwen-learned-verifier-v1-${{ steps.upstream.outputs.run_id }}
          path: upstream/qwen_learned_verifier
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.upstream.outputs.run_id }}
      - name: Revalidate Issue #43 and its Issue #38 promotion receipt
        run: |
          test "$(git rev-parse HEAD)" = "$ACTIVE_AUDIT_SOURCE_SHA"
          mkdir -p promotion/recomputed
          python scripts/validate_qwen_learned_verifier_evidence.py \
            upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1 \
            --protocol upstream/qwen_learned_verifier/configs/qwen_learned_verifier_bridge_v1.json \
            --expected-research-sha "$LEARNED_VERIFIER_SOURCE_SHA" \
            --output promotion/recomputed/qwen_learned_verifier_bridge_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          recorded=json.loads(Path('upstream/qwen_learned_verifier/validation/qwen_learned_verifier_bridge_v1.json').read_text())
          recomputed=json.loads(Path('promotion/recomputed/qwen_learned_verifier_bridge_v1.json').read_text())
          assert recorded == recomputed, 'Issue #43 validation report differs from independent recomputation'
          assert recomputed['valid'] is True
          assert recomputed['execution_status'] == 'completed'
          assert recomputed['scientific_result'] in {'direction_passed','direction_failed','underpowered'}
          PY
          python scripts/research_evidence_promotion.py validate \
            upstream/qwen_learned_verifier/promotion/qwen_alignment_to_learned_verifier.json \
            --stage qwen_alignment_to_learned_verifier \
            --downstream-run-id "${{ steps.upstream.outputs.run_id }}" \
            --downstream-source-sha "$LEARNED_VERIFIER_SOURCE_SHA" \
            --downstream-protocol upstream/qwen_learned_verifier/configs/qwen_learned_verifier_bridge_v1.json
          python scripts/research_evidence_promotion.py create \
            --stage learned_verifier_to_real_active_audit \
            --upstream-run-id "${{ steps.upstream.outputs.run_id }}" \
            --upstream-artifact-name "rvl-qwen-learned-verifier-v1-${{ steps.upstream.outputs.run_id }}" \
            --upstream-manifest upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1/manifest.json \
            --upstream-validation upstream/qwen_learned_verifier/validation/qwen_learned_verifier_bridge_v1.json \
            --downstream-run-id "${{ github.run_id }}" \
            --downstream-source-sha "$ACTIVE_AUDIT_SOURCE_SHA" \
            --downstream-protocol configs/real_llm_active_audit_v1.json \
            --output promotion/learned_verifier_to_real_active_audit.json
      - name: Validate active-audit CPU contracts
        run: |
          python -m py_compile \
            scripts/run_real_llm_active_audit.py \
            scripts/validate_real_llm_active_audit_evidence.py \
            scripts/research_evidence_promotion.py
          python -m unittest \
            tests.test_real_llm_active_audit \
            tests.test_research_evidence_promotion -v
      - name: Execute locked real-LLM active-audit replay
        run: |
          rm -rf results/real_llm_active_audit_v1
          python scripts/run_real_llm_active_audit.py \
            --protocol configs/real_llm_active_audit_v1.json \
            --input-root upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1 \
            --output results/real_llm_active_audit_v1
      - name: Independently validate active-audit output
        run: |
          mkdir -p validation
          python scripts/validate_real_llm_active_audit_evidence.py \
            results/real_llm_active_audit_v1 \
            --protocol configs/real_llm_active_audit_v1.json \
            --input-root upstream/qwen_learned_verifier/results/qwen_learned_verifier_bridge_v1 \
            --output validation/real_llm_active_audit_v1.json
      - name: Record immutable workflow provenance
        if: always()
        env:
          PINNED_RESEARCH_SOURCE: '857264b432c8d10fdc2a5bb838f9afc5e8c7b3c6'
          PROMOTION_RECEIPT: 'promotion/learned_verifier_to_real_active_audit.json'
        run: |
          mkdir -p provenance
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          protocol=Path('configs/real_llm_active_audit_v1.json')
          payload={
              "schema_version":1,
              "repository":os.environ.get("GITHUB_REPOSITORY"),
              "workflow":os.environ.get("GITHUB_WORKFLOW"),
              "workflow_ref":os.environ.get("GITHUB_WORKFLOW_REF"),
              "event_name":os.environ.get("GITHUB_EVENT_NAME"),
              "trigger_ref":os.environ.get("GITHUB_REF"),
              "trigger_sha":os.environ.get("GITHUB_SHA"),
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt":int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
              "research_source_sha":os.environ["PINNED_RESEARCH_SOURCE"],
              "protocol_sha256":hashlib.sha256(protocol.read_bytes()).hexdigest() if protocol.is_file() else None,
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_os":os.environ.get("RUNNER_OS"),
              "runner_arch":os.environ.get("RUNNER_ARCH"),
              "action_pins":{"checkout":"11d5960a326750d5838078e36cf38b85af677262","setup_python":"a26af69be951a213d495a4c3e4e4022e16d87065","upload_artifact":"ea165f8d65b6e75b540449e92b4886f43607fa02","download_artifact":"d3f86a106a0bac45b974a628896c90dbdf5c8093"},
          }
          for key in ("UPSTREAM_RUN_ID","PROMOTION_RECEIPT"):
              value=os.environ.get(key)
              if value:
                  payload[key.lower()]=value
          Path('provenance/workflow.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+"\\n")
          PY
      - name: Upload immutable real-LLM active-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rvl-real-llm-active-audit-v1-${{ github.run_id }}
          path: |
            configs/real_llm_active_audit_v1.json
            results/real_llm_active_audit_v1/
            validation/real_llm_active_audit_v1.json
            promotion/learned_verifier_to_real_active_audit.json
            promotion/recomputed/qwen_learned_verifier_bridge_v1.json
            provenance/workflow.json
          if-no-files-found: error
          retention-days: 90
