name: vllm-token-exact-bridge-contract

on:
  pull_request:
    paths:
      - 'src/rvl_systems/rlvr_benchmark.py'
      - 'src/generate_vllm_token_exact_replay.py'
      - 'src/train_vllm_token_exact_replay.py'
      - 'src/validate_vllm_token_exact_bridge.py'
      - 'scripts/run_vllm_token_exact_bridge_gpu.sh'
      - 'tests/test_vllm_token_exact_bridge.py'
      - 'docs/vllm_token_exact_bridge.md'
      - '.github/workflows/vllm-token-exact-bridge-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Token-exact replay and validator contracts
        run: python -m unittest tests.test_vllm_token_exact_bridge tests.test_mini_lab_serving.TokenServingTests -v
      - name: Syntax-check bridge modules and launcher
        run: |
          python -m py_compile src/generate_vllm_token_exact_replay.py src/train_vllm_token_exact_replay.py src/validate_vllm_token_exact_bridge.py
          bash -n scripts/run_vllm_token_exact_bridge_gpu.sh
