name: mlsys-correctness-first-task

on:
  pull_request:
    paths:
      - 'src/mlsys_env/**'
      - 'tasks/mlsys/**'
      - 'tests/test_mlsys_env.py'
      - 'docker/Dockerfile.mlsys'
      - 'docs/mlsys_research_automation.md'
      - '.github/workflows/mlsys-task.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install evaluator dependencies
        run: |
          pip install numpy==2.1.3
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check oracle integrity, gradient failures, timeout and claim gates
        run: python -m unittest tests.test_mlsys_env -v
      - name: Build and record candidate image
        run: |
          mkdir -p artifacts/mlsys
          docker build -f docker/Dockerfile.mlsys -t rvl-mlsys:ci .
          docker image inspect rvl-mlsys:ci > artifacts/mlsys/image.json
          docker image inspect rvl-mlsys:ci --format '{{.Id}}' > artifacts/mlsys/image-id.txt
      - name: Isolated baseline evaluation
        run: |
          python -m src.mlsys_env.evaluator prepare --output artifacts/mlsys/workspace
          python -m src.mlsys_env.evaluator evaluate \
            --candidate artifacts/mlsys/workspace/solution.py \
            --image "$(cat artifacts/mlsys/image-id.txt)" \
            --output artifacts/mlsys/baseline
      - name: Retain all reports including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mlsys-operator-development
          path: artifacts/mlsys/
          if-no-files-found: warn
