name: learned-verifier-head-contract

on:
  pull_request:
    paths:
      - 'src/rvl_systems/learned_verifier_head.py'
      - 'tests/test_learned_verifier_head.py'
      - 'docs/learned_verifier_head.md'
      - '.github/workflows/learned-verifier-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: python -m pip install 'torch>=2.4' 'numpy>=1.26'
      - name: Learned verifier artifact/runtime/deployment contracts
        run: python -m unittest tests.test_learned_verifier_head -v
      - name: Syntax check
        run: python -m py_compile src/rvl_systems/learned_verifier_head.py
