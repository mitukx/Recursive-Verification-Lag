name: mini-lab-acceptance

on:
  pull_request:
    paths:
      - 'src/rvl_systems/lab/**'
      - 'src/*mini_lab.py'
      - 'src/run_async_lm_lab.py'
      - 'src/run_coding_agent_lab.py'
      - 'src/rvl_systems/hf_trainer.py'
      - 'src/rvl_systems/hf_backend.py'
      - 'tests/test_mini_lab*.py'
      - '.github/workflows/mini-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Failure replay numerical and end-to-end acceptance tests
        run: python -m unittest discover -s tests -p 'test_mini_lab*.py' -v
      - name: Fully asynchronous actor learner smoke
        run: python -m src.run_mini_lab --output artifacts/async-lab --episodes 64 --actors 4 --audit-budget 16 --tool-latency-ms 1
      - name: Paired seed adaptive versus fixed versus no refresh benchmark
        run: python -m src.benchmark_mini_lab --output artifacts/ablation --seeds 17,29,43 --episodes 256 --learning-rates 0.08,0.2 --cadences 2,8
      - name: Verification debt control-plane benchmark
        run: python -m src.benchmark_verification_debt --output artifacts/verification-debt-benchmark.json
      - name: Upload measured artifacts and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-lab-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  causal-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-systems.txt
      - run: mkdir -p artifacts
      - run: pip freeze > artifacts/dependencies.txt
      - name: Real tensor microbatch replay and async training acceptance
        run: python -m unittest discover -s tests -p 'test_mini_lab_torch.py' -v
      - name: Two-rank token-level clipped RL update
        run: torchrun --standalone --nproc-per-node=2 -m src.run_distributed_mini_lab
      - name: Pretrained causal LM independent actor learner smoke
        run: python -m src.run_async_lm_lab --groups 3 --samples 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-lab-real-lm-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  executable-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated runtime and pin exact image ID
        run: |
          docker build -f docker/Dockerfile.mbppplus -t rvl-agent-tests .
          docker image inspect rvl-agent-tests --format '{{.Id}}' > /tmp/rvl-agent-image
      - name: Real generated Python tests and grader attack checks
        run: |
          export RVL_TEST_DOCKER_IMAGE="$(cat /tmp/rvl-agent-image)"
          python -m unittest discover -s tests -p 'test_mini_lab_docker.py' -v
