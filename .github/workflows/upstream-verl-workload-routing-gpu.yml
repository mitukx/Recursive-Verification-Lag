name: upstream-verl-workload-routing-gpu

on:
  push:
    branches:
      - 'upstream/verl-workload-aware-v1'
    paths:
      - 'upstream/verl/gpu-benchmark-trigger.json'
  workflow_dispatch:

concurrency:
  group: upstream-verl-workload-routing-gpu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    env:
      MODEL: Qwen/Qwen2.5-0.5B-Instruct
      MODEL_REVISION: 7ae557604adf67be50417f59c2c2f167def9a775
      VLLM_VERSION: 0.29.0
      TRANSFORMERS_VERSION: 5.12.1
      ROOT: artifacts/upstream-verl-workload-routing
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install verl-pinned serving stack
        run: |
          python -m pip install -U pip
          python -m pip install "vllm==${VLLM_VERSION}" "transformers==${TRANSFORMERS_VERSION}"

      - name: Record environment and assert two GPUs
        run: |
          mkdir -p "$ROOT"
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA required"
          assert torch.cuda.device_count() >= 2, "benchmark requires >=2 GPUs"
          print("torch", torch.__version__, "cuda", torch.version.cuda, "gpus", torch.cuda.device_count())
          PY
          nvidia-smi > "$ROOT/nvidia-smi.txt"
          python -m pip freeze > "$ROOT/dependencies.txt"
          cat > "$ROOT/protocol.json" <<EOF
          {
            "source_sha": "${GITHUB_SHA}",
            "model": "${MODEL}",
            "model_revision": "${MODEL_REVISION}",
            "vllm_version": "${VLLM_VERSION}",
            "transformers_version": "${TRANSFORMERS_VERSION}",
            "arms": ["least_inflight", "workload_aware"],
            "workloads": ["homogeneous", "heterogeneous"],
            "repeats": 3,
            "concurrency": 32,
            "claim_boundary": "real endpoint benchmark; retain negative/null outcomes"
          }
          EOF

      - name: Cache pinned model snapshot before replica launch
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              os.environ["MODEL"],
              revision=os.environ["MODEL_REVISION"],
          )
          PY

      - name: Launch two independent vLLM replicas
        run: |
          CUDA_VISIBLE_DEVICES=0 vllm serve "$MODEL"             --revision "$MODEL_REVISION"             --host 127.0.0.1 --port 8100             --dtype auto --max-model-len 4096             --gpu-memory-utilization 0.70             > "$ROOT/vllm-gpu0.log" 2>&1 &
          echo $! > "$ROOT/vllm-gpu0.pid"

          CUDA_VISIBLE_DEVICES=1 vllm serve "$MODEL"             --revision "$MODEL_REVISION"             --host 127.0.0.1 --port 8101             --dtype auto --max-model-len 4096             --gpu-memory-utilization 0.70             > "$ROOT/vllm-gpu1.log" 2>&1 &
          echo $! > "$ROOT/vllm-gpu1.pid"

      - name: Wait for both replicas
        run: |
          python - <<'PY'
          import time, urllib.request
          urls = ["http://127.0.0.1:8100/v1/models", "http://127.0.0.1:8101/v1/models"]
          deadline = time.time() + 600
          pending = set(urls)
          while pending and time.time() < deadline:
              for url in list(pending):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          if response.status == 200:
                              pending.remove(url)
                  except Exception:
                      pass
              if pending:
                  time.sleep(2)
          if pending:
              raise SystemExit(f"vLLM replicas not ready: {sorted(pending)}")
          print("both replicas ready")
          PY

      - name: Start GPU telemetry
        run: |
          nvidia-smi             --query-gpu=timestamp,index,utilization.gpu,utilization.memory,memory.used,memory.total,power.draw             --format=csv,noheader,nounits --loop=1             > "$ROOT/gpu-telemetry.csv" &
          echo $! > "$ROOT/gpu-monitor.pid"

      - name: Generate exact-token routing traces
        run: |
          python -m upstream.verl.generate_routing_traces             --model "$MODEL"             --revision "$MODEL_REVISION"             --requests 96             --seed 20261007             --output-dir "$ROOT/traces"

      - name: Homogeneous control
        run: |
          python -m upstream.verl.benchmark_real_endpoints             --endpoint http://127.0.0.1:8100             --endpoint http://127.0.0.1:8101             --model "$MODEL"             --trace "$ROOT/traces/homogeneous.jsonl"             --concurrency 32             --temperature 0             --repeats 3             --output "$ROOT/homogeneous.json"

      - name: Heterogeneous workload
        run: |
          python -m upstream.verl.benchmark_real_endpoints             --endpoint http://127.0.0.1:8100             --endpoint http://127.0.0.1:8101             --model "$MODEL"             --trace "$ROOT/traces/heterogeneous.jsonl"             --concurrency 32             --temperature 0             --repeats 3             --output "$ROOT/heterogeneous.json"

      - name: Stop telemetry and servers
        if: always()
        run: |
          test ! -f "$ROOT/gpu-monitor.pid" || kill "$(cat "$ROOT/gpu-monitor.pid")" 2>/dev/null || true
          test ! -f "$ROOT/vllm-gpu0.pid" || kill "$(cat "$ROOT/vllm-gpu0.pid")" 2>/dev/null || true
          test ! -f "$ROOT/vllm-gpu1.pid" || kill "$(cat "$ROOT/vllm-gpu1.pid")" 2>/dev/null || true

      - name: Manifest raw evidence
        if: always()
        run: |
          mapfile -t FILES < <(find "$ROOT" -type f ! -name manifest.json | sort)
          python -m src.manifest_artifacts --output "$ROOT/manifest.json" "${FILES[@]}"
          python -m src.manifest_artifacts --verify "$ROOT/manifest.json"

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-verl-workload-routing-${{ github.run_id }}
          path: artifacts/upstream-verl-workload-routing/
          if-no-files-found: error
          retention-days: 90
