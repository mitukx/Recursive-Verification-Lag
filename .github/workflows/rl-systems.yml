name: validate-rlvr-systems

on:
  pull_request:
    paths:
      - 'src/rvl_systems/**'
      - 'src/run_rlvr_systems_demo.py'
      - 'src/run_hf_grpo_smoke.py'
      - 'src/run_torch_distributed_smoke.py'
      - 'src/benchmark_rollout_engine.py'
      - 'src/benchmark_scheduler.py'
      - 'src/benchmark_scheduler_chaos.py'
      - 'src/benchmark_vllm_cluster.py'
      - 'tests/**'
      - 'requirements-systems.txt'
      - 'docs/xai_rl_systems.md'
      - 'docs/xai_evidence_matrix.md'
      - '.github/workflows/rl-systems.yml'
  push:
    branches:
      - 'systems/**'
    paths:
      - 'src/rvl_systems/**'
      - 'src/run_rlvr_systems_demo.py'
      - 'src/run_hf_grpo_smoke.py'
      - 'src/run_torch_distributed_smoke.py'
      - 'src/benchmark_rollout_engine.py'
      - 'src/benchmark_scheduler.py'
      - 'src/benchmark_scheduler_chaos.py'
      - 'src/benchmark_vllm_cluster.py'
      - 'tests/**'
      - '.github/workflows/rl-systems.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest tests.test_rlvr_systems tests.test_rlvr_reliability tests.test_rlvr_objectives tests.test_remote_workers tests.test_scheduler tests.test_scheduler_health tests.test_telemetry tests.test_weight_sync tests.test_profiling tests.test_worker_health tests.test_precision_numerics tests.test_worker_rpc tests.test_torch_distributed_config tests.test_dynamic_batching tests.test_vllm_batch tests.test_policy_deployment -v
      - name: Optional-backend syntax check
        run: python -m py_compile src/rvl_systems/hf_backend.py src/rvl_systems/hf_trainer.py src/rvl_systems/torch_distributed.py src/rvl_systems/dynamic_batch.py src/rvl_systems/vllm_batch.py src/run_hf_grpo_smoke.py src/run_torch_distributed_smoke.py src/benchmark_vllm_cluster.py src/benchmark_scheduler_chaos.py
      - name: End-to-end CPU smoke test
        run: python -m src.run_rlvr_systems_demo --rounds 3 --samples 8
      - name: Generate async rollout benchmark report
        run: python -m src.benchmark_rollout_engine --requests 8 --samples 2 --latency-ms 2 --concurrency 4 --output artifacts/async-rollout.json
      - name: Generate scheduler benchmark report
        run: python -m src.benchmark_scheduler --workers 2 --requests 16 --latency-ms 2 --queue-limit 4 --output artifacts/scheduler.json
      - name: Run scheduler failover/recovery chaos benchmark
        run: python -m src.benchmark_scheduler_chaos --requests 24 --recovery-requests 9 --latency-ms 1 --queue-limit 8 --output artifacts/scheduler-chaos.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: rlvr-systems-benchmarks-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 90
