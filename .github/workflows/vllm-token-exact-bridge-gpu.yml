name: vllm-token-exact-bridge-gpu

on:
  push:
    branches:
      - 'gpu-evidence/vllm-token-exact-bridge-v1'
  workflow_dispatch:
    inputs:
      model_repo:
        description: Hugging Face model repository
        required: true
        default: Qwen/Qwen2.5-0.5B-Instruct
      model_revision:
        description: Immutable model commit
        required: true
        default: 7ae557604adf67be50417f59c2c2f167def9a775

concurrency:
  group: vllm-token-exact-bridge-gpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bridge:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    env:
      MODEL_REPO: ${{ inputs.model_repo || 'Qwen/Qwen2.5-0.5B-Instruct' }}
      MODEL_REVISION: ${{ inputs.model_revision || '7ae557604adf67be50417f59c2c2f167def9a775' }}
      OUT: artifacts/vllm-token-exact-bridge
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install serving and learner dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-systems.txt -r requirements-gpu.txt
      - name: Assert CUDA
        run: |
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA required"
          assert torch.cuda.device_count() >= 1, "at least one CUDA GPU required"
          print("torch", torch.__version__, "cuda", torch.version.cuda, "gpus", torch.cuda.device_count())
          PY
      - name: Run real vLLM to GRPO token-exact bridge
        run: bash scripts/run_vllm_token_exact_bridge_gpu.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vllm-token-exact-bridge-${{ github.run_id }}
          path: artifacts/vllm-token-exact-bridge/
          if-no-files-found: error
          retention-days: 90
