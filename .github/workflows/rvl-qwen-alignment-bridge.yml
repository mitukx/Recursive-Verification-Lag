name: rvl-qwen-alignment-bridge

on:
  push:
    branches:
      - 'gpu-evidence/qwen-alignment-bridge-v1'
    paths:
      - 'gpu-evidence-trigger.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvl-qwen-alignment-bridge-v1
  cancel-in-progress: true

jobs:
  qwen-bridge:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 360
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9b539907da02e4832d3fa5186940a72803a0e2c7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned bridge dependencies
        run: |
          python -m pip install -U pip
          python -m pip install             'torch'             'transformers==4.57.1'             'datasets==3.6.0'             'accelerate==1.10.1'             'huggingface_hub'
          python -m pip install -r requirements.txt
      - name: Assert CUDA and record source
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), 'CUDA required'
          print('torch', torch.__version__, 'cuda', torch.version.cuda, 'device', torch.cuda.get_device_name(0))
          PY
          git rev-parse HEAD
      - name: Validate CPU-side bridge contracts
        run: python -m unittest tests.test_qwen_alignment_bridge -v
      - name: Execute locked real-model bridge
        run: |
          rm -rf results/qwen_alignment_bridge_v1
          python scripts/run_qwen_alignment_bridge.py             --protocol configs/qwen_alignment_bridge_v1.json             --output results/qwen_alignment_bridge_v1
      - name: Print fail-closed primary summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('results/qwen_alignment_bridge_v1/summary.json')
          if path.exists():
              print(json.dumps(json.loads(path.read_text()), indent=2))
          else:
              failure=Path('results/qwen_alignment_bridge_v1/failure.json')
              print(failure.read_text() if failure.exists() else 'no summary/failure file')
          PY
      - name: Upload immutable raw bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvl-qwen-alignment-bridge-v1-${{ github.run_id }}
          path: |
            configs/qwen_alignment_bridge_v1.json
            results/qwen_alignment_bridge_v1/
          if-no-files-found: error
          retention-days: 90