name: linear-hitting-qwen

on:
  pull_request:
    paths:
      - 'src/rsi_controller/hitting_verification.py'
      - 'scripts/run_linear_hitting_qwen.py'
      - 'scripts/validate_linear_hitting_qwen.py'
      - 'configs/linear_hitting_qwen_v1.json'
      - 'tests/test_linear_hitting_verifier.py'
      - 'tests/test_linear_hitting_qwen.py'
      - 'docs/linear_hitting_verifier.md'
      - '.github/workflows/linear-hitting-qwen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Unit theorem contracts
        run: python -m unittest tests.test_linear_hitting_verifier tests.test_linear_hitting_qwen -v
      - name: Execute retained-Qwen hitting benchmark
        run: |
          rm -rf artifacts/linear-hitting-qwen
          python -m scripts.run_linear_hitting_qwen \
            --protocol configs/linear_hitting_qwen_v1.json \
            --bank data/recovered_qwen05b_bank.jsonl \
            --output artifacts/linear-hitting-qwen
      - name: Independently validate
        run: |
          mkdir -p artifacts/validation
          python -m scripts.validate_linear_hitting_qwen \
            artifacts/linear-hitting-qwen \
            --protocol configs/linear_hitting_qwen_v1.json \
            --bank data/recovered_qwen05b_bank.jsonl \
            --output artifacts/validation/linear-hitting-qwen.json
          cat artifacts/validation/linear-hitting-qwen.json
          cat artifacts/linear-hitting-qwen/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linear-hitting-qwen-${{ github.run_id }}
          path: |
            configs/linear_hitting_qwen_v1.json
            artifacts/linear-hitting-qwen/
            artifacts/validation/linear-hitting-qwen.json
          if-no-files-found: error
          retention-days: 90
