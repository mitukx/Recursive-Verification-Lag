name: qwen-rlvr-gpu-acceptance

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model
        required: true
        default: Qwen/Qwen2.5-0.5B-Instruct
      train_limit:
        description: Number of GSM8K train examples
        required: true
        default: '32'
      eval_limit:
        description: Number of held-out GSM8K examples
        required: true
        default: '32'
      steps:
        description: RLVR update steps
        required: true
        default: '8'

permissions:
  contents: read

jobs:
  heldout-rlvr:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: 'false'
      MODEL: ${{ inputs.model }}
      TRAIN_LIMIT: ${{ inputs.train_limit }}
      EVAL_LIMIT: ${{ inputs.eval_limit }}
      STEPS: ${{ inputs.steps }}
      OUT: artifacts/qwen-rlvr
    steps:
      - uses: actions/checkout@v4
      - name: Record GPU environment
        run: |
          mkdir -p artifacts
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__)"
      - name: Run held-out Qwen RLVR experiment
        run: bash scripts/run_qwen_rlvr_gpu.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-rlvr-gpu-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
