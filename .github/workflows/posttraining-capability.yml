name: posttraining-capability-contract

on:
  pull_request:
    paths:
      - 'configs/posttraining_capability_campaign_v1.json'
      - 'scripts/summarize_posttraining_campaign.py'
      - 'scripts/summarize_colab_rlvr_pilot.py'
      - 'scripts/verify_colab_evidence_bundle.py'
      - 'tests/test_colab_rlvr_pilot_summary.py'
      - 'tests/test_colab_evidence_bundle.py'
      - 'notebooks/free_colab_mts_pilot.ipynb'
      - 'results/colab_rlvr_pilot_20261008/**'
      - 'docs/free_colab_pilot_evidence.md'
      - 'tests/test_posttraining_campaign.py'
      - 'docs/posttraining_capability_campaign.md'
      - '.github/workflows/posttraining-capability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Scorecard contracts
        run: |
          pip install numpy==2.2.6
          python -m unittest tests.test_posttraining_campaign tests.test_colab_rlvr_pilot_summary tests.test_colab_evidence_bundle -v
      - name: Recompute retained T4 evidence (no GPU rerun)
        run: python -m scripts.verify_colab_evidence_bundle
      - name: Syntax check
        run: |
          python -m py_compile scripts/summarize_posttraining_campaign.py scripts/summarize_colab_rlvr_pilot.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('notebooks/free_colab_mts_pilot.ipynb').read_text())
          for i, cell in enumerate(notebook['cells']):
              if cell['cell_type'] == 'code':
                  compile(''.join(cell['source']), f'cell-{i}', 'exec')
          PY
