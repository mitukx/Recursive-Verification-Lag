name: rsi-controller-acceptance

on:
  pull_request:
    paths:
      - 'src/rsi_controller/**'
      - 'configs/rsi/**'
      - 'tests/test_rsi_controller.py'
      - 'tests/test_mathematical_rsi.py'
      - 'src/benchmark_mathematical_rsi.py'
      - 'docs/oai_math_rsi_leap.md'
      - 'docs/rsi_controller.md'
      - 'docs/rsi_engineering_report.md'
      - '.github/workflows/rsi-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: RSI unit integration and E2E tests
        run: python -m unittest tests.test_rsi_controller tests.test_mathematical_rsi -v
      - name: Four-generation bounded Harness RSI baseline
        run: python -m src.rsi_controller.run --config configs/rsi/harness_baseline.yaml --generations 4 --output artifacts/rsi-ci
      - name: OAI-math RSI contract benchmark
        run: python -m src.benchmark_mathematical_rsi --output artifacts/mathematical-rsi-contract.json
      - name: Four-generation OAI-math RSI run
        run: python -m src.rsi_controller.run --config configs/rsi/oai_math_leap_v1.json --generations 4 --output artifacts/rsi-oai-math-ci
      - name: Verify mathematical RSI evidence
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          report=json.loads(Path('artifacts/mathematical-rsi-contract.json').read_text())
          assert all(report['checks'].values()), report['checks']
          summary=json.loads(Path('artifacts/rsi-oai-math-ci/metrics/summary.json').read_text())
          assert summary['mathematical_rsi_enabled'] is True
          db=sqlite3.connect('artifacts/rsi-oai-math-ci/research_memory.sqlite')
          count=db.execute("SELECT COUNT(*) FROM events WHERE kind='mathematical_rsi_assessment'").fetchone()[0]
          assert count == 4, count
          PY
      - name: Verify promotion rejection and plots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('artifacts/rsi-ci/metrics/generations.jsonl').read_text().splitlines() if x.strip()]
          outcomes={r['promotion_decision'] for r in rows}
          assert 'PROMOTED' in outcomes, outcomes
          assert 'REJECTED' in outcomes, outcomes
          assert len(list(Path('artifacts/rsi-ci/metrics').glob('*.svg'))) == 6
          assert all('sealed_score' not in r for r in rows), 'sealed metric leaked into adaptive telemetry'
          summary=json.loads(Path('artifacts/rsi-ci/metrics/summary.json').read_text())
          audit=summary['final_sealed_audit']
          assert 'never used' in audit['access_policy']
          assert audit['suite_digest'] == summary['evaluation']['suite_digests']['sealed']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rsi-controller-${{ matrix.os }}-${{ github.run_id }}
          path: |
            artifacts/rsi-ci/
            artifacts/rsi-oai-math-ci/
            artifacts/mathematical-rsi-contract.json
          if-no-files-found: warn
          retention-days: 90
