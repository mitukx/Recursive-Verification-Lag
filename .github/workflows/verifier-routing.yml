name: verifier-routing-evidence

on:
  pull_request:
    paths:
      - 'src/rvl_systems/verifier_rpc.py'
      - 'src/benchmark_verifier_routing.py'
      - 'tests/test_verifier_rpc.py'
      - 'tests/test_verifier_routing.py'
      - 'docs/verifier_tail_latency.md'
      - '.github/workflows/verifier-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verifier RPC and routing contracts
        run: python -m unittest tests.test_verifier_rpc tests.test_verifier_routing -v
      - name: Heterogeneous verifier RPC benchmark
        run: python -m src.benchmark_verifier_routing --requests 48 --output artifacts/verifier-routing.json
      - name: Validate measured evidence
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/verifier-routing.json'))
          assert p['status'] == 'control_plane_cpu_rpc_benchmark'
          assert len(p['raw']['baseline']) == 48
          assert len(p['raw']['adaptive']) == 48
          assert p['comparison']['p95_speedup'] > 0
          assert p['comparison']['throughput_speedup'] > 0
          print(json.dumps(p['comparison'], indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verifier-routing-${{ github.run_id }}
          path: artifacts/verifier-routing.json
          if-no-files-found: error
          retention-days: 90
