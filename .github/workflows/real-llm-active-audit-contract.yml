name: real-llm-active-audit-contract

on:
  pull_request:
    paths:
      - 'configs/real_llm_active_audit_v1.json'
      - 'scripts/run_real_llm_active_audit.py'
      - 'scripts/validate_real_llm_active_audit_evidence.py'
      - 'tests/test_real_llm_active_audit.py'
      - 'src/active_alignment_audit.py'
      - 'src/propensity_alignment_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU contract dependencies
        run: python -m pip install 'numpy>=1.26'
      - name: Compile real-LLM active-audit runner and validator
        run: |
          python -m py_compile \
            scripts/run_real_llm_active_audit.py \
            scripts/validate_real_llm_active_audit_evidence.py
      - name: Run real-LLM active-audit contracts
        run: python -m unittest tests.test_real_llm_active_audit -v
