name: real-llm-active-audit-contract

on:
  pull_request:
    paths:
      - 'configs/real_llm_active_audit_v1.json'
      - 'scripts/run_real_llm_active_audit.py'
      - 'scripts/validate_real_llm_active_audit_evidence.py'
      - 'tests/test_real_llm_active_audit.py'
      - 'src/active_alignment_audit.py'
      - 'src/propensity_alignment_audit.py'
      - 'scripts/research_evidence_promotion.py'
      - 'tests/test_research_evidence_promotion.py'
      - '.github/workflows/rvl-real-llm-active-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU contract dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Compile real-LLM active-audit runner and validator
        run: |
          python -m py_compile \
            scripts/run_real_llm_active_audit.py \
            scripts/validate_real_llm_active_audit_evidence.py \
            scripts/research_evidence_promotion.py
      - name: Run real-LLM active-audit contracts
        run: |
          python -m unittest \
            tests.test_real_llm_active_audit \
            tests.test_research_evidence_promotion -v
